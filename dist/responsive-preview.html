<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>ChiHome responsive preview</title><style>body{margin:0;padding:20px;background:#dedbd2;font:14px system-ui}iframe{border:0;height:1700px;background:white;transform-origin:top left;display:block;box-shadow:0 10px 35px #0002}nav{margin-bottom:20px;display:flex;gap:15px}button{padding:12px 20px;background:#18272d;color:white;border:0;cursor:pointer}</style></head><body><nav><button onclick="size(390)">Mobile 390px</button><button onclick="size(768)">Tablet 768px</button><button onclick="size(1280)">Desktop 1280px</button></nav><div id="metrics"></div><iframe src="index.html" title="Responsive preview" style="width:1280px"></iframe><script>function size(w){const f=document.querySelector("iframe");f.style.width=w+"px";f.style.height=(w===390?800:1700)+"px";f.style.transform="scale("+Math.min(1,(innerWidth-40)/w)+")";setTimeout(measure,150)}function measure(){const d=document.querySelector("iframe").contentDocument;document.querySelector("#metrics").textContent="Viewport: "+d.documentElement.clientWidth+" / Content: "+d.documentElement.scrollWidth+" / "+[...d.querySelectorAll("body *")].filter(e=>e.getBoundingClientRect().right>d.documentElement.clientWidth+1).slice(0,5).map(e=>e.tagName+"."+e.className).join(", ")}document.querySelector("iframe").onload=measure;size(1280);</script></body></html>
